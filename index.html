<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#18B9A6">
<title>루덴스 양치 인증 · 시연용 모의 프로토타입</title>
<style>
:root{
  --mint:#18B9A6; --mint-d:#0E8C7E; --mint-l:#5FE3D1;
  --ink:#10322E; --ink-soft:#5B7470; --paper:#F2FBF9;
  --card:#FFFFFF; --line:#D8EEEA; --danger:#E4573C; --warn:#E8923B;
  --gold:#F2B705; --pt:#0E8C7E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{
  background:#CFE7E2;
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:440px; margin:0 auto; height:100dvh;
  display:flex; flex-direction:column;
  background:radial-gradient(130% 70% at 50% -10%, #ffffff 0%, var(--paper) 46%, #E9F7F4 100%);
  position:relative; overflow:hidden;
}
/* ---------- header ---------- */
#appHeader{
  padding:11px 14px 9px; display:flex; align-items:center; gap:10px; flex:0 0 auto;
  border-bottom:1px solid var(--line); background:rgba(242,251,249,.86); backdrop-filter:blur(4px); z-index:5;
}
.logo{
  width:36px; height:36px; border-radius:11px; flex:0 0 auto;
  background:linear-gradient(145deg,var(--mint-l),var(--mint));
  box-shadow:0 5px 12px rgba(24,185,166,.33);
  display:flex; align-items:center; justify-content:center;
}
.hbtn-back{
  width:34px; height:34px; border-radius:11px; flex:0 0 auto; border:1px solid var(--line);
  background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.hbtn-back svg{width:18px;height:18px;}
.brand{line-height:1.12; min-width:0;}
.brand h1{font-size:18px; margin:0; font-weight:800; letter-spacing:-.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand h1 b{color:var(--mint-d);}
.brand .tag{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-top:1px;}
.draft-badge{
  margin-left:auto; font-size:10px; font-weight:800; color:#9A5B12;
  background:#FFF3DF; border:1px solid #F3D8A6; padding:5px 9px; border-radius:20px; white-space:nowrap;
}
/* ---------- screens ---------- */
#screens{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative;}
.screen{display:none; padding:14px 14px 20px; animation:fade .28s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  box-shadow:0 6px 18px rgba(16,50,46,.06); padding:14px; margin-bottom:12px;
}
.sectitle{font-size:15px; font-weight:800; letter-spacing:-.4px; margin:0 2px 8px;}
.muted{color:var(--ink-soft);}
.lead{font-size:13.5px; line-height:1.55; font-weight:600; color:var(--ink); margin:2px 2px 0;}
/* ---------- buttons ---------- */
.btn{
  border:0; font-family:inherit; font-weight:800; font-size:14.5px;
  padding:13px 10px; border-radius:14px; cursor:pointer; transition:.18s; touch-action:manipulation; width:100%;
}
.btn.primary{background:var(--mint); color:#fff; box-shadow:0 6px 14px rgba(24,185,166,.34);}
.btn.primary:active{transform:translateY(1px);}
.btn.ghost{background:#EAF4F2; color:var(--ink-soft);}
.btn.warn{background:var(--warn); color:#fff; box-shadow:0 6px 14px rgba(232,146,59,.3);}
.btn.sm{font-size:13px; padding:10px 12px; width:auto;}
.btn:disabled{opacity:.5; cursor:default;}
.btnrow{display:flex; gap:8px; margin-top:4px;}
.pill{display:inline-block; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:20px; background:#E4F7F3; color:var(--mint-d); border:1px solid var(--line);}
.pill.kid{background:#FFF0E0; color:#B5631A; border-color:#F3D8A6;}
.pill.adult{background:#E7EEFF; color:#3A5BB0; border-color:#CBD8F5;}
/* ---------- onboarding ---------- */
.ob-hero{text-align:center; padding:12px 6px 4px;}
.ob-hero .big{font-size:22px; font-weight:800; letter-spacing:-.6px; margin:10px 0 6px;}
.ob-hero p{font-size:13.5px; color:var(--ink-soft); line-height:1.55; font-weight:600; margin:0;}
.ob-emoji{font-size:46px;}
.field{margin-bottom:14px;}
.field > label{display:block; font-size:13px; font-weight:800; margin:0 2px 8px; color:var(--ink);}
.opts{display:flex; gap:8px; flex-wrap:wrap;}
.opt{
  flex:1 1 0; min-width:62px; text-align:center; border:1.6px solid var(--line); background:var(--card);
  font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft);
  padding:12px 4px; border-radius:13px; cursor:pointer; transition:.18s;
}
.opt.active{background:var(--mint); border-color:var(--mint); color:#fff; box-shadow:0 5px 12px rgba(24,185,166,.3);}
.opt .sub{display:block; font-size:10px; font-weight:700; margin-top:3px; opacity:.85;}
.consent{
  display:flex; gap:10px; align-items:flex-start; background:#FFF8EE; border:1px solid #F3D8A6;
  border-radius:14px; padding:12px 13px; margin-bottom:14px;
}
.consent input{width:20px; height:20px; margin-top:1px; accent-color:var(--mint); flex:0 0 auto;}
.consent p{margin:0; font-size:12px; line-height:1.5; font-weight:600; color:#8A5A1C;}
.consent.hide{display:none;}
/* ---------- home ---------- */
.greet{font-size:16px; font-weight:800; margin:2px 2px 12px; letter-spacing:-.3px;}
.greet b{color:var(--mint-d);}
.today-card{text-align:center; padding:16px 14px;}
.today-card .t-ttl{font-size:13px; font-weight:800; color:var(--mint-d); margin-bottom:12px;}
.dots{display:flex; gap:14px; justify-content:center; margin-bottom:12px;}
.dot3{width:54px; height:54px; position:relative;}
.dot3 .lab{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--ink-soft);}
.dot3.on .lab{color:var(--mint-d);}
.today-sub{font-size:12.5px; color:var(--ink-soft); font-weight:600; line-height:1.5;}
.today-sub b{color:var(--mint-d);}
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:12px;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:15px; padding:12px 8px; text-align:center; box-shadow:0 5px 14px rgba(16,50,46,.05);}
.stat .v{font-size:20px; font-weight:800; letter-spacing:-.5px; color:var(--mint-d); font-variant-numeric:tabular-nums;}
.stat .v small{font-size:12px; font-weight:800;}
.stat .k{font-size:10.8px; font-weight:700; color:var(--ink-soft); margin-top:3px;}
.menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.menu-grid.five .m-item:first-child{grid-column:span 2;}
.m-item{
  display:flex; gap:11px; align-items:center; background:var(--card); border:1px solid var(--line);
  border-radius:15px; padding:13px 12px; cursor:pointer; transition:.16s; text-align:left; box-shadow:0 4px 12px rgba(16,50,46,.05);
}
.m-item:active{transform:translateY(1px);}
.m-badge{width:34px; height:34px; border-radius:11px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:800; color:#fff; background:linear-gradient(145deg,var(--mint-l),var(--mint));}
.m-item .mt{min-width:0;}
.m-item .mt b{font-size:13.5px; font-weight:800; display:block; letter-spacing:-.3px;}
.m-item .mt span{font-size:11px; color:var(--ink-soft); font-weight:600;}
.quick{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px;}
.q-item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 6px; text-align:center; cursor:pointer; box-shadow:0 4px 12px rgba(16,50,46,.05);}
.q-item .qi{font-size:20px;}
.q-item .qt{font-size:11px; font-weight:800; margin-top:4px;}
.q-item .qs{font-size:10px; color:var(--ink-soft); font-weight:600; margin-top:1px;}
/* ---------- brushing guide (reused) ---------- */
.g-head{display:flex; align-items:center; gap:8px; margin:0 2px 10px;}
.g-head .gt{font-size:15px; font-weight:800;}
.methodnote{
  background:#E4F7F3; border:1px solid var(--line); color:var(--mint-d);
  font-size:12px; font-weight:700; line-height:1.45; padding:9px 12px; border-radius:13px; margin-bottom:11px;
}
.methodnote b{background:var(--mint); color:#fff; font-weight:800; font-size:11px; padding:2px 8px; border-radius:20px; margin-right:6px; white-space:nowrap;}
.pastecard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:11px 13px; margin-bottom:11px;}
.pastehead{font-size:13px; font-weight:800; color:var(--mint-d); margin-bottom:7px; display:flex; align-items:center; gap:7px;}
.pastehead .phdot{width:7px; height:7px; border-radius:50%; background:var(--mint); flex:0 0 auto;}
.pasterow{display:flex; gap:10px; align-items:center;}
.pasteicon{width:116px; height:68px; flex:0 0 auto;}
.pastetxt{flex:1; min-width:0;}
.amt{font-size:12.5px; color:var(--ink); font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:7px;}
.amt b{color:var(--mint-d); font-weight:800;}
.amt .pdot{border-radius:50%; background:#5FD6C6; flex:0 0 auto;}
.amt .pdot.rice{width:5px; height:5px;}
.amt .pdot.pea{width:9px; height:9px;}
.pastetxt .note{font-size:10.8px; color:var(--ink-soft); line-height:1.5; margin-top:5px; font-weight:500;}
.timerwrap{display:flex; align-items:center; gap:14px; padding:12px 14px;}
.ring{position:relative; width:84px; height:84px; flex:0 0 auto;}
.ring svg{transform:rotate(-90deg);}
.ring .rtxt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;}
.ring .rtxt b{font-size:21px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums;}
.ring .rtxt span{font-size:9.5px; color:var(--ink-soft); font-weight:700; margin-top:3px;}
.tinfo{flex:1 1 auto; min-width:0;}
.tinfo .step{font-size:12px; font-weight:700; color:var(--mint-d);}
.tinfo .stepname{font-size:17px; font-weight:800; letter-spacing:-.4px; margin:2px 0 8px;}
.bar{height:8px; background:#E6F4F1; border-radius:6px; overflow:hidden;}
.bar>i{display:block; height:100%; width:0%; border-radius:6px; background:linear-gradient(90deg,var(--mint),var(--mint-l)); transition:width .25s linear;}
.totlabel{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-top:5px;}
.stage{position:relative; padding:4px 6px 2px; display:flex; justify-content:center;}
.mouthSvg{width:100%; max-width:324px; height:auto; display:block; touch-action:manipulation;}
.hi{fill:#C3F6EC; opacity:0; pointer-events:none; transition:opacity .35s ease, filter .35s ease;}
.hi.active{opacity:.2; filter:drop-shadow(0 0 5px rgba(24,185,166,.8)) drop-shadow(0 0 10px rgba(24,185,166,.4));}
.hit{fill:transparent; pointer-events:all; cursor:pointer;}
.brushSweep{animation:sweep 2.6s ease-in-out infinite;}
.foam{animation:foam 1.3s ease-in-out infinite;}
@keyframes sweep{0%,100%{transform:translateX(-13px);} 50%{transform:translateX(13px);}}
@keyframes foam{0%,100%{opacity:.25; transform:translateY(0);} 50%{opacity:.85; transform:translateY(-3px);}}
.chips{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:4px;}
.chip{border:1.5px solid var(--line); background:var(--card); font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-soft);
  padding:9px 2px; border-radius:12px; cursor:pointer; transition:.2s; touch-action:manipulation;}
.chip .n{display:block; font-size:9.5px; color:var(--mint); font-weight:800; margin-bottom:1px;}
.chip.active{background:var(--mint); border-color:var(--mint); color:#fff; box-shadow:0 5px 12px rgba(24,185,166,.33);}
.chip.active .n{color:#CFF6EF;}
.instruct{display:flex; gap:10px; align-items:flex-start; background:#EAF8F5; border:1px solid var(--line); border-radius:14px; padding:12px 13px; margin-top:12px;}
.instruct .ic{width:26px; height:26px; flex:0 0 auto; border-radius:9px; background:var(--mint); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800;}
.instruct p{margin:0; font-size:13.5px; line-height:1.5; font-weight:600; color:var(--ink);}
.instruct.done{background:#E4F9EE; border-color:#B9ECCF;}
.instruct.done p{font-size:15px; font-weight:800; color:#17864E;}
.g-controls{display:flex; gap:8px; margin-top:12px;}
.g-controls .btn{padding:12px 6px;}
.g-controls .btn.ghost.on{background:var(--mint-d); color:#fff;}
.cam{margin-top:12px; display:none;}
.cam.show{display:block;}
.cambox{position:relative; width:100%; aspect-ratio:16/10; border-radius:16px; overflow:hidden; background:#0E2B27; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;}
.cambox video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:none;}
.cambox.live video{display:block;}
.cammsg{color:#CDEFEA; font-size:12.5px; text-align:center; padding:0 22px; line-height:1.55; font-weight:600;}
.cambox.live .cammsg{display:none;}
.camtag{position:absolute; top:9px; left:10px; background:rgba(14,43,39,.72); color:#fff; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px;}
.camscan{position:absolute; inset:0; pointer-events:none; display:none;}
.cambox.scanning .camscan{display:block;}
.camscan .frame{position:absolute; left:16%; right:16%; top:18%; bottom:18%; border:2px dashed rgba(95,227,209,.85); border-radius:16px;}
.camscan .line{position:absolute; left:16%; right:16%; height:2px; background:linear-gradient(90deg,transparent,#5FE3D1,transparent); animation:scan 1.5s linear infinite;}
@keyframes scan{0%{top:20%;}50%{top:78%;}100%{top:20%;}}
/* ---------- verify mock panel ---------- */
.mock-note{background:#FFF3DF; border:1px solid #F3D8A6; color:#9A5B12; font-size:11.5px; font-weight:700; line-height:1.5; padding:9px 12px; border-radius:13px; margin-bottom:11px;}
.sig{display:flex; align-items:center; gap:11px; padding:11px 0; border-top:1px dashed var(--line);}
.sig:first-of-type{border-top:0;}
.sig .sgi{width:30px; height:30px; flex:0 0 auto; border-radius:10px; background:#EAF4F2; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; transition:.2s;}
.sig.run .sgi{background:#E4F7F3; color:var(--mint-d);}
.sig.ok .sgi{background:var(--mint); color:#fff;}
.sig .sgb{flex:1; min-width:0;}
.sig .sgt{font-size:13px; font-weight:800; display:flex; justify-content:space-between; gap:8px;}
.sig .sgt .st{font-size:11px; font-weight:800; color:var(--ink-soft);}
.sig.run .sgt .st{color:var(--mint-d);}
.sig.ok .sgt .st{color:#17864E;}
.sig .sgbar{height:6px; background:#E6F4F1; border-radius:5px; overflow:hidden; margin-top:6px;}
.sig .sgbar>i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--mint),var(--mint-l)); border-radius:5px;}
.sig .sgsub{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-top:3px;}
/* ---------- shop ---------- */
.pt-top{display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,var(--mint),var(--mint-d)); color:#fff; border-radius:18px; padding:15px 17px; margin-bottom:13px; box-shadow:0 8px 20px rgba(14,140,126,.3);}
.pt-top .l .k{font-size:11.5px; font-weight:700; opacity:.9;}
.pt-top .l .v{font-size:27px; font-weight:800; letter-spacing:-.5px; margin-top:2px;}
.pt-top .l .v small{font-size:14px;}
.pt-top .coin{width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:24px;}
.shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
.prod{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; box-shadow:0 5px 14px rgba(16,50,46,.05); display:flex; flex-direction:column;}
.prod .pic{height:76px; border-radius:12px; background:#EAF8F5; display:flex; align-items:center; justify-content:center; font-size:38px; margin-bottom:9px;}
.prod .pn{font-size:13px; font-weight:800; letter-spacing:-.3px;}
.prod .pd{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin:2px 0 9px; line-height:1.4; flex:1;}
.prod .pc{font-size:13.5px; font-weight:800; color:var(--mint-d); margin-bottom:9px;}
.prod .pc small{font-size:11px;}
.prod .btn{padding:10px 6px; font-size:13px;}
/* ---------- calendar ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin:0 2px 10px;}
.cal-head .m{font-size:16px; font-weight:800;}
.streak-chip{font-size:12px; font-weight:800; color:#B5631A; background:#FFF0E0; border:1px solid #F3D8A6; padding:6px 11px; border-radius:20px;}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal .wd{font-size:10.5px; font-weight:800; color:var(--ink-soft); text-align:center; padding:4px 0;}
.cal .cell{aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-soft); background:#F1F8F6; border:1px solid transparent; position:relative;}
.cal .cell.empty{background:transparent;}
.cal .cell.lv1{background:#CFF0E9; color:var(--mint-d);}
.cal .cell.lv2{background:#7FE0D1; color:#07463F;}
.cal .cell.lv3{background:var(--mint); color:#fff;}
.cal .cell.today{border-color:var(--warn); box-shadow:0 0 0 2px rgba(232,146,59,.25);}
.cal .cell .cc{font-size:8px; font-weight:800; margin-top:1px;}
.cal-legend{display:flex; gap:12px; justify-content:center; margin-top:11px; font-size:10.5px; font-weight:700; color:var(--ink-soft);}
.cal-legend span{display:flex; align-items:center; gap:5px;}
.cal-legend i{width:12px; height:12px; border-radius:4px; display:inline-block;}
.score-top{display:flex; align-items:center; gap:14px;}
.score-ring{width:92px; height:92px; position:relative; flex:0 0 auto;}
.score-ring .s-v{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.score-ring .s-v b{font-size:26px; font-weight:800; color:var(--mint-d); letter-spacing:-.5px;}
.score-ring .s-v span{font-size:9px; font-weight:800; color:var(--ink-soft);}
.score-side{flex:1;}
.score-side .st{font-size:15px; font-weight:800;}
.score-side .sd{font-size:11.5px; color:var(--ink-soft); font-weight:600; line-height:1.5; margin-top:3px;}
.brk{margin-top:12px;}
.brk .row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.brk .row .bl{font-size:12px; font-weight:800; width:92px; flex:0 0 auto;}
.brk .row .bbar{flex:1; height:8px; background:#E6F4F1; border-radius:5px; overflow:hidden;}
.brk .row .bbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--mint),var(--mint-l)); border-radius:5px;}
.brk .row .bv{font-size:11.5px; font-weight:800; color:var(--mint-d); width:34px; text-align:right; flex:0 0 auto;}
/* ---------- replace (brush) ---------- */
.rep-top{text-align:center; padding:6px 0 2px;}
.rep-ring{width:150px; height:150px; position:relative; margin:4px auto 8px;}
.rep-ring .rv{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.rep-ring .rv b{font-size:34px; font-weight:800; letter-spacing:-1px;}
.rep-ring .rv .d{font-size:12px; font-weight:800; color:var(--ink-soft); margin-top:2px;}
.rep-ring .rv .rl{font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-top:5px;}
.rep-info{font-size:12.5px; font-weight:600; color:var(--ink-soft); line-height:1.6;}
.rep-info b{color:var(--ink);}
.rep-warn{background:#FDECE7; border:1px solid #F3C3B5; color:#B23A1E; font-size:12.5px; font-weight:800; padding:11px 13px; border-radius:13px; margin:11px 0; line-height:1.5;}
.rep-ok{background:#E4F9EE; border:1px solid #B9ECCF; color:#17864E; font-size:12.5px; font-weight:800; padding:11px 13px; border-radius:13px; margin:11px 0; line-height:1.5;}
/* ---------- content lists ---------- */
.subtabs{display:flex; gap:6px; margin:0 0 12px; background:#E3F4F0; padding:5px; border-radius:16px; border:1px solid var(--line);}
.subtab{flex:1; border:0; background:transparent; font-family:inherit; font-size:13px; font-weight:800; color:var(--ink-soft); padding:9px 0; border-radius:12px; cursor:pointer; transition:.2s;}
.subtab.active{background:var(--card); color:var(--mint-d); box-shadow:0 3px 9px rgba(16,50,46,.1);}
.subpane{display:none;} .subpane.active{display:block;}
.ill{display:flex; justify-content:center; padding:4px 0 2px;}
.ill svg{width:100%; max-width:300px; height:auto;}
.steps{list-style:none; margin:12px 0 0; padding:0;}
.steps li{display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-top:1px dashed var(--line);}
.steps li:first-child{border-top:0;}
.steps .num{width:25px; height:25px; flex:0 0 auto; border-radius:50%; background:var(--mint); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.steps p{margin:0; font-size:13.5px; line-height:1.48; font-weight:600;}
.steps small{color:var(--ink-soft); font-weight:600;}
.tipbox{margin-top:12px; background:#EAF8F5; border:1px solid var(--line); border-radius:14px; padding:11px 13px; font-size:12.8px; line-height:1.5; font-weight:700; color:var(--mint-d);}
.fact{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-top:1px dashed var(--line);}
.fact:first-of-type{border-top:0;}
.fact .fn{width:24px; height:24px; flex:0 0 auto; border-radius:8px; background:var(--mint); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.fact p{margin:0; font-size:13px; line-height:1.5; font-weight:600;}
.info-card{display:flex; gap:12px; align-items:flex-start; margin-bottom:10px;}
.info-card .ii{font-size:26px; flex:0 0 auto;}
.info-card .it b{font-size:13.5px; font-weight:800; display:block; margin-bottom:3px;}
.info-card .it p{margin:0; font-size:12.5px; line-height:1.5; font-weight:600; color:var(--ink-soft);}
/* ---------- doctor ---------- */
.flow{display:flex; align-items:center; justify-content:space-between; gap:4px; margin:4px 0 2px;}
.flow .fstep{flex:1; text-align:center;}
.flow .fstep .fc{width:46px; height:46px; border-radius:14px; background:#EAF8F5; display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 5px;}
.flow .fstep .fl{font-size:10.5px; font-weight:800; color:var(--ink-soft); line-height:1.3;}
.flow .arr{color:var(--mint); font-weight:800; font-size:16px; flex:0 0 auto; padding-bottom:16px;}
.consent-box{background:#FFF8EE; border:1px solid #F3D8A6; border-radius:14px; padding:13px; margin:12px 0;}
.consent-box .cb-t{font-size:13px; font-weight:800; color:#8A5A1C; margin-bottom:7px;}
.consent-box ul{margin:0; padding-left:17px;}
.consent-box li{font-size:12px; line-height:1.55; font-weight:600; color:#8A5A1C; margin-bottom:3px;}
/* ---------- menu list screen ---------- */
.ml-item{display:flex; gap:12px; align-items:center; padding:14px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
.ml-item:last-child{border-bottom:0;}
.ml-item .mli{width:38px; height:38px; border-radius:12px; flex:0 0 auto; background:linear-gradient(145deg,var(--mint-l),var(--mint)); display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; font-weight:800;}
.ml-item .mlt{flex:1; min-width:0;}
.ml-item .mlt b{font-size:14px; font-weight:800; display:block;}
.ml-item .mlt span{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
.ml-item .chev{color:var(--ink-soft); font-size:18px; flex:0 0 auto;}
.dev-reset{margin-top:16px; text-align:center;}
.dev-reset button{font-family:inherit; font-size:11.5px; font-weight:700; color:var(--ink-soft); background:transparent; border:1px dashed var(--line); padding:9px 16px; border-radius:20px; cursor:pointer;}
/* ---------- bottom nav ---------- */
#bnav{flex:0 0 auto; display:none; border-top:1px solid var(--line); background:rgba(255,255,255,.95); backdrop-filter:blur(6px);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
#bnav.show{display:flex;}
.nav-i{flex:1; border:0; background:transparent; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0; cursor:pointer; color:var(--ink-soft);}
.nav-i svg{width:22px; height:22px;}
.nav-i .nl{font-size:10px; font-weight:800;}
.nav-i.active{color:var(--mint-d);}
.nav-i.verify-cta{position:relative;}
.nav-i.verify-cta .vc{width:46px; height:46px; margin-top:-16px; border-radius:50%; background:linear-gradient(145deg,var(--mint-l),var(--mint)); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px rgba(24,185,166,.4); color:#fff;}
.nav-i.verify-cta .vc svg{width:24px; height:24px;}
/* ---------- footer note ---------- */
.foot-note{font-size:9.5px; line-height:1.5; color:var(--ink-soft); text-align:center; font-weight:500; margin:14px 4px 0;}
/* ---------- overlay / celebration ---------- */
#overlay{position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:40; background:rgba(16,50,46,.45); padding:24px;}
#overlay.show{display:flex;}
.cele{background:#fff; border-radius:22px; padding:26px 22px 20px; text-align:center; max-width:320px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.3); position:relative; overflow:hidden; animation:pop .4s cubic-bezier(.2,1.3,.5,1);}
@keyframes pop{from{transform:scale(.8); opacity:0;} to{transform:scale(1); opacity:1;}}
.cele .coin{width:84px; height:84px; margin:0 auto 10px; border-radius:50%; background:radial-gradient(circle at 36% 32%, #FFE79A, var(--gold)); display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:800; color:#8A6100; box-shadow:0 8px 18px rgba(242,183,5,.4); animation:coinspin 1.1s ease;}
@keyframes coinspin{0%{transform:rotateY(0) scale(.5);}60%{transform:rotateY(540deg) scale(1.08);}100%{transform:rotateY(540deg) scale(1);}}
.cele .ctitle{font-size:21px; font-weight:800; letter-spacing:-.5px; margin-bottom:5px;}
.cele .cpts{font-size:30px; font-weight:800; color:var(--gold); letter-spacing:-1px; margin-bottom:6px;}
.cele .cdesc{font-size:12.5px; color:var(--ink-soft); font-weight:600; line-height:1.55; margin-bottom:16px;}
.cele .cdesc b{color:var(--mint-d);}
.cele .btn{margin-bottom:0;}
.confetti{position:absolute; top:-12px; width:8px; height:14px; border-radius:2px; opacity:.9; animation:fall 1.5s ease-in forwards;}
@keyframes fall{to{transform:translateY(320px) rotate(360deg); opacity:0;}}
.generic-modal{background:#fff; border-radius:20px; padding:22px 20px 18px; text-align:center; max-width:320px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.3); animation:pop .3s ease;}
.generic-modal .gm-i{font-size:40px; margin-bottom:8px;}
.generic-modal .gm-t{font-size:18px; font-weight:800; margin-bottom:6px;}
.generic-modal .gm-d{font-size:13px; color:var(--ink-soft); font-weight:600; line-height:1.55; margin-bottom:16px;}
.generic-modal .gm-d b{color:var(--mint-d);}
.generic-modal .btnrow .btn{margin:0;}
</style>
</head>

<script>
(function(){
"use strict";

/* ========================================================================
   STATE  (simulated persistence in localStorage)
   ======================================================================== */
var LS_KEY='chika_state';
var TODAY=new Date(2026,10,25);            // fixed demo "today": 2026-11-25
function pad(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function offsetDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x;}
var TODAY_KEY=dateKey(TODAY);

function seedHistory(){
  // offset(days ago) -> brushings that day; builds an 8-day live streak + earlier fill
  var pat=[3,2,3,3,2,3,3,2, 0, 3,2,2,3,3,2,3, 1,0,3,2,3];
  var h={};
  for(var i=1;i<=pat.length;i++){ if(pat[i-1]>0) h[dateKey(offsetDays(TODAY,-i))]=pat[i-1]; }
  return h;
}
function freshState(){
  return {
    profile:null,                 // {age, sex, type:'adult'|'kid', consent}
    points:320,
    todayCount:0,
    history:seedHistory(),
    brushRegisterDate:dateKey(offsetDays(TODAY,-79)),  // ~79일 사용 → 교체 임박
    regularity:74,                // mock 시간대 규칙성 %
    doctorRequested:false,
    purchases:[]
  };
}
var state=load();
function load(){
  try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var s=JSON.parse(raw); if(s&&typeof s==='object') return s; } }catch(e){}
  var f=freshState(); try{ localStorage.setItem(LS_KEY,JSON.stringify(f)); }catch(e){} return f;
}
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} }
function resetDemo(){ state=freshState(); save(); }

function computeStreak(){
  var s=0;
  for(var i=0;i<400;i++){
    var c = (i===0)? state.todayCount : (state.history[dateKey(offsetDays(TODAY,-i))]||0);
    if(c>=1) s++; else { if(i===0) continue; else break; }
  }
  return s;
}
function last14(){
  var days=[];
  for(var i=0;i<14;i++){ var c=(i===0)?state.todayCount:(state.history[dateKey(offsetDays(TODAY,-i))]||0); days.push(c); }
  return days;
}
function habit(){
  var streak=computeStreak();
  var d14=last14();
  var three=0; d14.forEach(function(c){ if(c>=3) three++; });
  var streakComp=Math.min(streak,14)/14*40;
  var rate3=three/14*35;
  var regComp=state.regularity/100*25;
  var total=Math.round(streakComp+rate3+regComp);
  return {total:total, streak:streak, streakComp:Math.round(streakComp), rate3:Math.round(rate3),
          rate3pct:Math.round(three/14*100), regComp:Math.round(regComp), reg:state.regularity, three:three};
}

/* ========================================================================
   DENTAL GEOMETRY  (reused from current app; parameterized by id-prefix)
   ======================================================================== */
var UA={cx:150,cy:270,a0:232,a1:308};
var LA={cx:150,cy:30, a0:52, a1:128};
var RO=200, RI=172;
var B1=RI+(RO-RI)/3, B2=RI+2*(RO-RI)/3;
function pt(cx,cy,ang,r){var a=ang*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)];}
function f(x){return x.toFixed(1);}
function arcSeg(ar,a0,a1,r){
  var dir=a1>=a0?1:-1, s='';
  for(var a=a0; dir>0?a<a1:a>a1; a+=dir*2){var p=pt(ar.cx,ar.cy,a,r); s+='L'+f(p[0])+' '+f(p[1]);}
  var pe=pt(ar.cx,ar.cy,a1,r); return s+'L'+f(pe[0])+' '+f(pe[1]);
}
function annSector(ar,rIn,rOut){
  var p0=pt(ar.cx,ar.cy,ar.a0,rOut);
  return 'M'+f(p0[0])+' '+f(p0[1])+arcSeg(ar,ar.a0,ar.a1,rOut)+arcSeg(ar,ar.a1,ar.a0,rIn)+'Z';
}
function layoutTeeth(ar){
  var tF=['incisorC','incisorL','canine','premolar','molar'];
  var wF=[1.1,0.92,0.84,1.0,1.32];
  var types=tF.slice().reverse().concat(tF), ws=wF.slice().reverse().concat(wF);
  var tot=0; ws.forEach(function(w){tot+=w;});
  var span=ar.a1-ar.a0, cum=0, out=[];
  for(var i=0;i<types.length;i++){
    var tw=span*ws[i]/tot;
    out.push({type:types[i], ang:ar.a0+cum+tw/2, aw:tw});
    cum+=tw;
  }
  return out;
}
function toothShape(type,hw,hh,P){
  var d, det='';
  if(type==='incisorC'||type==='incisorL'){
    d='M'+f(-hw)+' '+f(hh*0.4)
     +'C'+f(-hw)+' '+f(hh*0.96)+' '+f(-hw*0.46)+' '+f(hh)+' 0 '+f(hh)
     +'C'+f(hw*0.46)+' '+f(hh)+' '+f(hw)+' '+f(hh*0.96)+' '+f(hw)+' '+f(hh*0.4)
     +'C'+f(hw)+' '+f(-hh*0.5)+' '+f(hw*0.78)+' '+f(-hh)+' '+f(hw*0.34)+' '+f(-hh)
     +'L'+f(-hw*0.34)+' '+f(-hh)
     +'C'+f(-hw*0.78)+' '+f(-hh)+' '+f(-hw)+' '+f(-hh*0.5)+' '+f(-hw)+' '+f(hh*0.4)+'Z';
    det='<ellipse cx="'+f(-hw*0.05)+'" cy="'+f(hh*0.18)+'" rx="'+f(hw*0.58)+'" ry="'+f(hh*0.64)+'" fill="url(#'+P+'sheenV)"/>'
      +'<ellipse cx="'+f(-hw*0.22)+'" cy="'+f(-hh*0.34)+'" rx="'+f(hw*0.28)+'" ry="'+f(hh*0.26)+'" fill="#FFFFFF" opacity="0.8"/>'
      +'<g stroke="#DBE8E3" stroke-width="0.7" stroke-opacity="0.45" stroke-linecap="round" fill="none">'
      +'<path d="M'+f(-hw*0.34)+' '+f(hh*0.74)+'V'+f(hh*0.05)+'"/>'
      +'<path d="M0 '+f(hh*0.8)+'V'+f(hh*0.08)+'"/>'
      +'<path d="M'+f(hw*0.34)+' '+f(hh*0.74)+'V'+f(hh*0.05)+'"/></g>';
  } else if(type==='canine'){
    d='M0 '+f(hh)
     +'Q'+f(hw*0.62)+' '+f(hh*0.9)+' '+f(hw*0.92)+' '+f(hh*0.22)
     +'C'+f(hw)+' '+f(-hh*0.45)+' '+f(hw*0.72)+' '+f(-hh)+' '+f(hw*0.3)+' '+f(-hh)
     +'L'+f(-hw*0.3)+' '+f(-hh)
     +'C'+f(-hw*0.72)+' '+f(-hh)+' '+f(-hw)+' '+f(-hh*0.45)+' '+f(-hw*0.92)+' '+f(hh*0.22)
     +'Q'+f(-hw*0.62)+' '+f(hh*0.9)+' 0 '+f(hh)+'Z';
    det='<ellipse cx="'+f(-hw*0.08)+'" cy="'+f(hh*0.1)+'" rx="'+f(hw*0.46)+'" ry="'+f(hh*0.66)+'" fill="url(#'+P+'sheenV)"/>'
      +'<ellipse cx="'+f(-hw*0.18)+'" cy="'+f(-hh*0.3)+'" rx="'+f(hw*0.24)+'" ry="'+f(hh*0.3)+'" fill="#FFFFFF" opacity="0.8"/>'
      +'<path d="M0 '+f(hh*0.92)+'V'+f(-hh*0.25)+'" stroke="#DBE8E3" stroke-width="0.8" stroke-opacity="0.5" stroke-linecap="round" fill="none"/>';
  } else if(type==='premolar'){
    d='M'+f(-hw)+' 0'
     +'C'+f(-hw)+' '+f(hh*0.72)+' '+f(-hw*0.5)+' '+f(hh)+' 0 '+f(hh)
     +'C'+f(hw*0.5)+' '+f(hh)+' '+f(hw)+' '+f(hh*0.72)+' '+f(hw)+' 0'
     +'C'+f(hw)+' '+f(-hh*0.72)+' '+f(hw*0.5)+' '+f(-hh)+' 0 '+f(-hh)
     +'C'+f(-hw*0.5)+' '+f(-hh)+' '+f(-hw)+' '+f(-hh*0.72)+' '+f(-hw)+' 0Z';
    var pcy=hh*0.44, prx=hw*0.66, pry=hh*0.48;
    det='<ellipse cx="0" cy="0" rx="'+f(hw*0.78)+'" ry="'+f(hh*0.34)+'" fill="url(#'+P+'fossa)"/>'
      +'<path d="M'+f(-hw*0.48)+' 0H'+f(hw*0.48)+'" stroke="#A8BFB9" stroke-opacity="0.28" stroke-width="'+f(hh*0.12)+'" stroke-linecap="round" fill="none"/>'
      +'<g fill="url(#'+P+'cuspBump)">'
      +'<ellipse cx="0" cy="'+f(-pcy)+'" rx="'+f(prx)+'" ry="'+f(pry)+'"/>'
      +'<ellipse cx="0" cy="'+f(pcy)+'" rx="'+f(prx)+'" ry="'+f(pry)+'"/></g>'
      +'<g fill="#FFFFFF" opacity="0.92">'
      +'<ellipse cx="'+f(-prx*0.28)+'" cy="'+f(-pcy-pry*0.3)+'" rx="'+f(prx*0.3)+'" ry="'+f(pry*0.22)+'"/>'
      +'<ellipse cx="'+f(-prx*0.28)+'" cy="'+f(pcy-pry*0.3)+'" rx="'+f(prx*0.3)+'" ry="'+f(pry*0.22)+'"/></g>';
  } else {
    d='M'+f(-hw)+' '+f(-hh*0.58)
     +'Q'+f(-hw)+' '+f(-hh)+' '+f(-hw*0.58)+' '+f(-hh)
     +'L'+f(hw*0.58)+' '+f(-hh)
     +'Q'+f(hw)+' '+f(-hh)+' '+f(hw)+' '+f(-hh*0.58)
     +'L'+f(hw)+' '+f(hh*0.58)
     +'Q'+f(hw)+' '+f(hh)+' '+f(hw*0.58)+' '+f(hh)
     +'L'+f(-hw*0.58)+' '+f(hh)
     +'Q'+f(-hw)+' '+f(hh)+' '+f(-hw)+' '+f(hh*0.58)+'Z';
    var mcx=hw*0.46, mcy=hh*0.45, mrx=hw*0.5, mry=hh*0.5;
    det='<ellipse cx="0" cy="0" rx="'+f(hw*0.8)+'" ry="'+f(hh*0.8)+'" fill="url(#'+P+'fossa)"/>'
      +'<g stroke="#A8BFB9" stroke-opacity="0.26" stroke-linecap="round" fill="none">'
      +'<path d="M'+f(-hw*0.58)+' 0H'+f(hw*0.58)+'" stroke-width="'+f(hh*0.1)+'"/>'
      +'<path d="M0 '+f(-hh*0.58)+'V'+f(hh*0.58)+'" stroke-width="'+f(hw*0.1)+'"/></g>'
      +'<g fill="url(#'+P+'cuspBump)">'

    s+='</g>'; fld.innerHTML=s;
  })();

  var elapsed=0, running=false, completed=false, lastTs=0, rafId=null, activeIdx=-1;
  var cur={x:150,y:74,r:-28}, tgt={x:150,y:74,r:-28};
  var zoom={s:1,x:0,y:0}, zoomT={s:1,x:0,y:0};
  var brushPos=$('brushPos'), zoomG=$('zoomG'), subRing=$('subRing');
  var RING_C=2*Math.PI*37;

    zoomT=regionFocus(i);
  }
  function applyBrush(dx,dy,dr){ dx=dx||0;dy=dy||0;dr=dr||0;
    brushPos.setAttribute('transform','translate('+(cur.x+dx).toFixed(2)+' '+(cur.y+dy).toFixed(2)+') rotate('+(cur.r+dr).toFixed(2)+')'); }
  function rollPhase(ts){ var Pp=1150, t=(ts%Pp)/Pp, fwd=0.64, u; if(t<fwd){ u=t/fwd; return 1-(1-u)*(1-u); } u=(t-fwd)/(1-fwd); return 1-(u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2); }
  function fmt(s){s=Math.max(0,Math.ceil(s)); var m=Math.floor(s/60); var ss=s%60; return m+':'+(ss<10?'0':'')+ss;}
  function jumpTo(i){ i=Math.max(0,Math.min(5,i)); completed=false; elapsed=i*REGION_SECONDS; $('instruct').classList.remove('done'); setRegion(i); render(); }
  function render(){
    var i=curIndex(); setRegion(i);
    var remain=Math.max(0,TOTAL-elapsed);
    $('bigTime').textContent=completed?'0:00':fmt(remain);
    var tp=Math.min(100,elapsed/TOTAL*100);
    $('totBar').style.width=tp.toFixed(1)+'%'; $('totLabel').textContent='전체 진행 '+Math.round(tp)+'%';
    var sub=completed?REGION_SECONDS:(elapsed-i*REGION_SECONDS);
    var frac=Math.max(0,Math.min(1,sub/REGION_SECONDS));
    subRing.setAttribute('stroke-dashoffset',(RING_C*(1-frac)).toFixed(2));
    $('btnPlay').textContent=completed?'다시 하기':(running?'일시정지':(elapsed>0?'계속하기':'시작'));
  }
  function finish(){ completed=true; running=false; elapsed=TOTAL; $('instruct').classList.add('done');
    $('instructText').textContent='다 닦았어요! 잘했어요'; render(); if(opts.onFinish) opts.onFinish(); }
  function loop(ts){
    if(lastTs===0) lastTs=ts; var dt=(ts-lastTs)/1000; lastTs=ts; if(dt>0.25) dt=0.25;
    if(running && !completed){ elapsed+=dt; if(elapsed>=TOTAL){ finish(); } else render(); }
    var k=0.16; cur.x+=(tgt.x-cur.x)*k; cur.y+=(tgt.y-cur.y)*k; cur.r+=(tgt.r-cur.r)*k;
    var zk=0.11; zoom.s+=(zoomT.s-zoom.s)*zk; zoom.x+=(zoomT.x-zoom.x)*zk; zoom.y+=(zoomT.y-zoom.y)*zk; applyZoom();
    var rg=REGIONS[activeIdx]||REGIONS[0]; var dir=(rg.arch==='U')?1:-1; var ph=rollPhase(ts); applyBrush(0,dir*ph*13,dir*ph*15);
    rafId=requestAnimationFrame(loop);
  }
  $('btnPlay').addEventListener('click',function(){ if(completed){ resetAll(); return; } running=!running; if(running) lastTs=0; render(); });
  $('btnReset').addEventListener('click',resetAll);
  function resetAll(){ running=false; completed=false; elapsed=0; lastTs=0; $('instruct').classList.remove('done'); setRegion(0); render(); }

  var camStream=null;
  function startCam(scan){
    if(!opts.camera) return;
    var cam=$('cam'), box=$('cambox'), video=$('video'), msg=$('camMsg');
    cam.classList.add('show'); if($('btnCam')){ $('btnCam').classList.add('on'); $('btnCam').textContent='거울 끄기'; }
    if(scan) box.classList.add('scanning');
    msg.textContent='카메라를 준비하고 있어요...';
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      msg.textContent='이 기기에서는 카메라를 쓸 수 없어요. 괜찮아요, 거울 앞에서 함께 닦아도 좋아요!'; return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(function(st){
      camStream=st; video.srcObject=st; box.classList.add('live'); var pl=video.play(); if(pl&&pl.catch) pl.catch(function(){});
    }).catch(function(){
      box.classList.remove('live');
      msg.textContent='카메라를 켤 수 없어요. 허용되지 않았거나 사용 중일 수 있어요. 거울 앞에서 함께 닦아도 좋아요!';
    });
  }
  function stopCam(){
    if(!opts.camera) return;
    if(camStream){ camStream.getTracks().forEach(function(t){t.stop();}); camStream=null; }
    var box=$('cambox'); if(box){ box.classList.remove('live'); box.classList.remove('scanning'); }
    var cam=$('cam'); if(cam) cam.classList.remove('show');
    if($('btnCam')){ $('btnCam').classList.remove('on'); $('btnCam').textContent='거울 보기'; }
    if($('camMsg')) $('camMsg').textContent='버튼을 누르면 앞 카메라로 내 입을 비춰 볼 수 있어요.';
  }
  if(opts.camera && $('btnCam')){
    $('btnCam').addEventListener('click',function(){ if(camStream || $('cam').classList.contains('show')){ stopCam(); } else { startCam(false); } });
  }

  setRegion(0); cur={x:REGIONS[0].brush.x,y:REGIONS[0].brush.y,r:REGIONS[0].brush.r};
  zoom=regionFocus(0); zoomT=regionFocus(0); applyZoom(); applyBrush(); render();

  return {
    root:root,
    start:function(){ if(!rafId){ lastTs=0; rafId=requestAnimationFrame(loop); } },
    stop:function(){ if(rafId){ cancelAnimationFrame(rafId); rafId=null; } },
    jumpTo:jumpTo, reset:resetAll, startCam:startCam, stopCam:stopCam,
    play:function(){ if(!completed){ running=true; lastTs=0; render(); } },
    pause:function(){ running=false; render(); }
  };
}

function ringSVG(size,frac,color,track,w){
  var r=(size-w)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,frac)));
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+w+'"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>';
}

var mockTimers=[], mockRaf=null;
function cancelMock(){ mockTimers.forEach(function(t){clearTimeout(t);}); mockTimers=[]; if(mockRaf){cancelAnimationFrame(mockRaf); mockRaf=null;} }
function resetSignals(){
  ['v1','v2','v3'].forEach(function(id){ var s=document.getElementById('sig-'+id); if(!s)return;
    s.classList.remove('run','ok'); s.querySelector('.st').textContent='대기'; s.querySelector('.sgbar>i').style.width='0%';
    if(id==='v3') s.querySelector('.sgsub').textContent='6구역 · 구역당 15~20초 (데모 단축)'; });

function setSig(id,cls,txt){ var s=document.getElementById('sig-'+id); if(!s)return; s.classList.remove('run','ok'); if(cls)s.classList.add(cls); if(txt)s.querySelector('.st').textContent=txt; }
function animateBar(id,from,to,dur,cb){
  var s=document.getElementById('sig-'+id); if(!s){cb&&cb();return;} var bar=s.querySelector('.sgbar>i');
  var t0=null;
  function step(ts){ if(t0===null)t0=ts; var k=Math.min(1,(ts-t0)/dur); bar.style.width=(from+(to-from)*k).toFixed(1)+'%';
    if(k<1){ mockRaf=requestAnimationFrame(step); } else { mockRaf=null; cb&&cb(); } }
  mockRaf=requestAnimationFrame(step);
}
function startMock(){
  cancelMock(); resetSignals();
  var btn=document.getElementById('vStart'); btn.disabled=true; btn.textContent='인식 중...';
  verifyInst.__fullMode=false; verifyInst.reset(); verifyInst.startCam(true);
  // phase 1
  setSig('v1','run','진행');
  animateBar('v1',0,100,2600,function(){ setSig('v1','ok','완료 ✓');
    // phase 2
    setSig('v2','run','진행');
    animateBar('v2',0,100,2200,function(){ setSig('v2','ok','완료 ✓');
      // phase 3: cycle regions
      setSig('v3','run','진행'); runRegions(0);
    });
  });
}
function runRegions(i){
  if(i>5){ setSig('v3','ok','완료 ✓'); finishMock(); return; }
  verifyInst.jumpTo(i);
  var s=document.getElementById('sig-v3'); if(s) s.querySelector('.sgsub').textContent='구역 '+(i+1)+'/6 닦는 중...';
  animateBar('v3', i/6*100, (i+1)/6*100, 1150, function(){ runRegions(i+1); });
}
function finishMock(){
  var btn=document.getElementById('vStart'); btn.disabled=false; btn.textContent='다시 인증하기';
  verifyInst.stopCam();
  completeVerification();
}
function completeVerification(){
  var n=state.todayCount+1;
  var capped = n>3;
  if(capped) n=state.todayCount; // no further count beyond 3
  var award = n===2?50 : (n===3?100 : 0);
  if(!capped){ state.todayCount=n; state.history[TODAY_KEY]=n; }
  state.points+=award; save();
  showCelebrate(award,n,capped);
}

        +'<div class="arr">→</div>'
